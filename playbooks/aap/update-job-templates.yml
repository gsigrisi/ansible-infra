---
- name: Update job_templates is AAP
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: false

  vars_files:
    - "{{ playbook_dir }}/../../vaults/{{ env }}-vault.yml"

  vars:
    json_query_name: "json.results[*].name"

  pre_tasks:
    - name: Include vars from controller_configs directory
      include_vars:
        dir: ../../configs
        ignore_files: [controller_config.yml.template]
        extensions: ["yml"]

    - name: Get host list
      uri:
        url: "{{ satellite_server_url }}/api/hosts"
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        method: GET
        return_content: true
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201, 202]
      no_log: true
      register: host_list

    - name: Set satellite host list
      set_fact:
        satellite_hosts: "{{ host_list | community.general.json_query(json_query_name) }}"
      no_log: true
      loop:
        - "{{ host_list }}"

    - name: Add oVirt virtual machines to the host list
      block:
        - name: Log in to oVirt
          ovirt.ovirt.ovirt_auth:
            url: "{{ engine_url | default(lookup('env', 'OVIRT_URL')) | default(omit) }}"
            hostname: "{{ engine_fqdn | default(lookup('env', 'OVIRT_HOSTNAME')) | default(omit) }}"
            username: "{{ engine_user | default(lookup('env', 'OVIRT_USERNAME')) | default(omit) }}"
            password: "{{ engine_password | default(lookup('env', 'OVIRT_PASSWORD')) | default(omit) }}"
            ca_file: "{{ engine_cafile | default(lookup('env', 'OVIRT_CAFILE')) | default(omit) }}"
            insecure: "{{ engine_insecure | default(true) }}"
          when: ovirt_auth is undefined or not ovirt_auth

        - name: Get the oVirt virtual machine list
          ovirt.ovirt.ovirt_vm_info:
            auth: "{{ ovirt_auth }}"
          register: ovirt_vm_list

        - name: Merge oVirt virtual machine names into the host list
          set_fact:
            ovirt_vm_names: "{{ ovirt_vm_list.ovirt_vms | default([]) | map(attribute='name') | list }}"
            satellite_hosts: "{{ (satellite_hosts | default([])) | union(ovirt_vm_list.ovirt_vms | default([]) | map(attribute='name') | list) }}"

        - name: Show oVirt virtual machines in the host list
          debug:
            msg: "{{ ovirt_vm_names }}"
      always:
        - name: Log out of oVirt
          ovirt.ovirt.ovirt_auth:
            state: absent
            ovirt_auth: "{{ ovirt_auth }}"
          when: ovirt_auth is defined

    - name: Create a new token using controller username/password
      ansible.platform.token:
        description: "Creating token to test controller jobs"
        scope: "write"
        state: present
        validate_certs: false
        gateway_hostname: "{{ controller_hostname }}"
        gateway_username: "{{ controller_username }}"
        gateway_password: "{{ controller_password }}"
      when: not controller_token

  roles:
    - role: infra.aap_configuration.controller_job_templates
      vars:
        aap_validate_certs: false
      when: controller_templates is defined
...
