---
- name: Update host list in job_template host-delete
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: false

  vars_files:
    - "{{ playbook_dir }}/../../vaults/{{ env }}-vault.yml"

  vars:
    json_query_name: "json.results[*].name"

  pre_tasks:
    - name: Include vars from controller_configs directory
      include_vars:
        dir: ../../configs
        ignore_files: [controller_config.yml.template]
        extensions: ["yml"]

    - name: Get host list
      uri:
        url: "{{ satellite_server_url }}/api/hosts"
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        method: GET
        return_content: true
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201, 202]
      no_log: true
      register: host_list

    - name: Set satellite host list
      set_fact:
        satellite_hosts: "{{ host_list | community.general.json_query(json_query_name) }}"
      no_log: true
      loop:
        - "{{ host_list }}"

    - name: Create a new token using controller username/password
      ansible.platform.token:
        description: "Creating token to test controller jobs"
        scope: "write"
        state: present
        validate_certs: false
        gateway_hostname: "{{ controller_hostname }}"
        gateway_username: "{{ controller_username }}"
        gateway_password: "{{ controller_password }}"
      when: not controller_token

  roles:
    - role: infra.aap_configuration.controller_job_templates
      vars:
        aap_validate_certs: false
      when: controller_templates is defined
...
