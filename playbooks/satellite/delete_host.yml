---
- name: delete hosts
  hosts: "{{ targeted_host| default('localhost') }}"
  connection: local

  module_defaults:
    redhat.satellite.host:
      username: "{{ satellite_username }}"
      password: "{{ satellite_password }}"
      server_url: "{{ satellite_server_url }}"
      validate_certs: no

  vars_files:
    - "{{ playbook_dir }}/../../vaults/{{ env }}-vault.yml"

  pre_tasks:
    - name: check that required variables are defined
      ansible.builtin.assert:
        that: 
          - vm_name
        fail_msg: "hostname(s) must be defined"

  tasks:
    - name: delete vm(s)
      block:
        - name: "Delete {% if vm_name |length > 1 %}hosts{% else %}host{% endif %}{{':'}} {{ vm_name }}"
          redhat.satellite.host:
            name: "{{ item }}"
            state: absent
          loop: "{{ vm_name }}"

        - name: Log in to oVirt
          ovirt.ovirt.ovirt_auth:
            url: "{{ engine_url | default(lookup('env', 'OVIRT_URL')) | default(omit) }}"
            hostname: "{{ engine_fqdn | default(lookup('env', 'OVIRT_HOSTNAME')) | default(omit) }}"
            username: "{{ engine_user | default(lookup('env', 'OVIRT_USERNAME')) | default(omit) }}"
            password: "{{ engine_password | default(lookup('env', 'OVIRT_PASSWORD')) | default(omit) }}"
            ca_file: "{{ engine_cafile | default(lookup('env', 'OVIRT_CAFILE')) | default(omit) }}"
            insecure: "{{ engine_insecure | default(true) }}"
          when: ovirt_auth is undefined or not ovirt_auth

        - name: Remove VM from oVirt
          ovirt.ovirt.ovirt_vm:
            auth: "{{ ovirt_auth }}"
            name: "{{ item }}"
            state: absent
          loop: "{{ vm_name }}"

      always:
        - name: Log out of oVirt
          ovirt.ovirt.ovirt_auth:
            state: absent
            ovirt_auth: "{{ ovirt_auth }}"
          when: ovirt_auth is defined

