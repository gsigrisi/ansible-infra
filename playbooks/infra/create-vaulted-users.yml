---
- name: Create user secrets in Vault
  hosts: localhost
  gather_facts: true
  vars:
    engine_name: ansible-infra
    base_path: users-credentials/teams
  vars_files:
    - "{{ playbook_dir }}/../../vars/vaulted-users.yml"
    - "{{ playbook_dir }}/../../vaults/{{ env }}-vault.yml"

  handlers:
    - name: Create user in Vault
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_url }}"
        engine_mount_point: "{{ engine_name }}"
        path: "{{ base_path }}/{{ item.0.name }}/{{ item.1.username }}"
        data:
          username: "{{ item.1.username }}"
          password: "{{ item.1.password }}"
          ssh_key: "{{ item.1.ssh_key }}"
          created_at: "{{ ansible_date_time.iso8601 }}"
          is_sudo: "{{ item.1.is_sudo }}"
          user_state: "{{ item.1.user_state }}"
          servers: "{{ item.1.servers }}"
        validate_certs: false
      loop: "{{ _teams | subelements('members') }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.username }}"
      when: (item.0.name ~ '/' ~ item.1.username) not in _users
      no_log: true

  tasks:
    - name: Enable KV v2 secrets engine
      ansible.builtin.command:
        cmd: vault secrets enable -version=2 -path={{ engine_name }} kv
      environment:
        VAULT_ADDR: "{{ vault_url }}"
        VAULT_SKIP_VERIFY: "1"
        VAULT_ROLE_ID: "{{ vault_role_id }}"
        VAULT_SECRET_ID: "{{ vault_secret_id }}"
      register: enable_result
      changed_when: "'already mounted' not in enable_result.stderr"
      failed_when: false

    - name: Check whether each user secret exists
      ansible.builtin.command:
        cmd: vault kv get -format=json {{ engine_name }}/{{ base_path }}/{{ item.0.name }}/{{ item.1.username }}
      environment:
        VAULT_ADDR: "{{ vault_url }}"
        VAULT_SKIP_VERIFY: "1"
        VAULT_ROLE_ID: "{{ vault_role_id }}"
        VAULT_SECRET_ID: "{{ vault_secret_id }}"
      register: result
      failed_when: result.rc not in [0, 2]
      changed_when: result.rc == 2
      notify: Create user in Vault
      loop: "{{ _teams | subelements('members') }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.username }}"
      no_log: true

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: List teams in Vault
      ansible.builtin.command:
        cmd: vault kv list -format=json {{ engine_name }}/{{ base_path }}
      environment:
        VAULT_ADDR: "{{ vault_url }}"
        VAULT_SKIP_VERIFY: "1"
        VAULT_ROLE_ID: "{{ vault_role_id }}"
        VAULT_SECRET_ID: "{{ vault_secret_id }}"
      register: vault_teams_raw
      changed_when: false
      failed_when: vault_teams_raw.rc not in [0, 2]

    - name: Show teams stored in Vault
      ansible.builtin.debug:
        msg: "{{ vault_teams_raw.stdout | from_json | map('regex_replace', '/$', '') | list }}"
      when: vault_teams_raw.rc == 0
