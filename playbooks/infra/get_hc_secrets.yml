---
- name: Test Vault with community.hashi_vault (AppRole)
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Set platform/version/env specific variables
      include_vars: "{{ __vars_file }}"
      loop:
        - "{{ hostvars[inventory_hostname].env }}.yml"
      vars:
        __vars_file: "{{ playbook_dir }}/../../vars/{{ hostvars[inventory_hostname].env }}.yml"
      when: __vars_file is file

    - name: Set login/env specific variables
      include_vars: "{{ __vault_file }}"
      loop:
        - "{{ hostvars[inventory_hostname].env }}-vault.yml"
      vars:
        __vault_file: "{{ playbook_dir }}/../../vaults/{{ hostvars[inventory_hostname].env }}-vault.yml"
      when: __vault_file is file

    - name: Get secret from Vault KV2 using AppRole
      community.hashi_vault.vault_kv2_get:
        url: "{{ hc_vault }}"
        path: "myapp/config"                  # ← Change this to your secret path
        engine_mount_point: "kv"              # Use "secret" if using KV v1
        auth_method: approle
        role_id: "{{ lookup('env', 'VAULT_APPROLE_ROLE_ID') }}"      # Pulled from credential
        secret_id: "{{ lookup('env', 'VAULT_APPROLE_SECRET_ID') }}"  # Pulled from credential
        validate_certs: false
      register: vault_result
      no_log: false

    - name: Show full response from Vault
      ansible.builtin.debug:
        var: vault_result

    - name: Show secret value
      ansible.builtin.debug:
        msg:
          - "Username : {{ vault_result.data.data.username | default('Not found') }}"
          - "Password : {{ vault_result.data.data.password | default('Not found') }}"
          - "Remote Execution Username: {{ vault_result.data.data.remote_execution_user | default('Not found') }}"
