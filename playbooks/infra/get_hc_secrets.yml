---
- name: Get secrets from Vault with community.hashi_vault (AppRole)
  hosts: localhost
  gather_facts: false
  vars:
    vault_approle_role_id: "{{ lookup('env', 'VAULT_APPROLE_ROLE_ID') | default(vault_role_id | default(''), true) }}"
    vault_approle_secret_id: "{{ lookup('env', 'VAULT_APPROLE_SECRET_ID') | default(vault_secret_id | default(''), true) }}"
  module_defaults:
    community.hashi_vault.vault_list:
      url: "{{ hc_vault }}"
      auth_method: approle
      role_id: "{{ vault_approle_role_id }}"
      secret_id: "{{ vault_approle_secret_id }}"
      validate_certs: false
    community.hashi_vault.vault_kv2_get:
      url: "{{ hc_vault }}"
      auth_method: approle
      role_id: "{{ vault_approle_role_id }}"
      secret_id: "{{ vault_approle_secret_id }}"
      engine_mount_point: ansible-infra
      validate_certs: false


  vars_files:
    - "{{ playbook_dir }}/../../vaults/{{ env }}-vault.yml"

  tasks:
    - name: Set platform/version/env specific variables
      include_vars: "{{ __vars_file }}"
      loop:
        - "{{ hostvars[inventory_hostname].env }}.yml"
      vars:
        __vars_file: "{{ playbook_dir }}/../../vars/{{ hostvars[inventory_hostname].env }}.yml"
      when: __vars_file is file

    - name: Set login/env specific variables
      include_vars: "{{ __vault_file }}"
      loop:
        - "{{ hostvars[inventory_hostname].env }}-vault.yml"
      vars:
        __vault_file: "{{ playbook_dir }}/../../vaults/{{ hostvars[inventory_hostname].env }}-vault.yml"
      when: __vault_file is file

    - name: Require an AppRole role id and secret id
      ansible.builtin.assert:
        that:
          - vault_approle_role_id | length > 0
          - vault_approle_secret_id | length > 0
        fail_msg: >-
          Set VAULT_APPROLE_ROLE_ID and VAULT_APPROLE_SECRET_ID,
          or vault_role_id and vault_secret_id in the env vault.
          An empty role id makes Vault return
          "failed to determine alias name from login request".

    # Read is denied on users-credentials/teams itself. The policy allows
    # ansible-infra/data/users-credentials/teams/<team>/<user>.
    - name: List teams in Vault
      community.hashi_vault.vault_list:
        path: ansible-infra/metadata/users-credentials/teams
      register: vault_teams

    - name: List users in each team
      community.hashi_vault.vault_list:
        path: "ansible-infra/metadata/users-credentials/teams/{{ item | regex_replace('/$', '') }}"
      loop: "{{ vault_teams.data.data['keys'] }}"
      loop_control:
        label: "{{ item }}"
      register: vault_users

    - name: Build team and user paths
      ansible.builtin.set_fact:
        team_user_lists: "{{ team_user_lists | default([]) + [{'team': item.item | regex_replace('/$', ''), 'users': item.data.data['keys']}] }}"
      loop: "{{ vault_users.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Get each user secret from Vault KV2
      community.hashi_vault.vault_kv2_get:
        path: "users-credentials/teams/{{ item.0.team }}/{{ item.1 | regex_replace('/$', '') }}"
      loop: "{{ team_user_lists | subelements('users') }}"
      loop_control:
        label: "{{ item.0.team }}/{{ item.1 }}"
      register: vault_result
      no_log: true

    - name: Collect usernames read from Vault
      ansible.builtin.set_fact:
        vault_users_read: >-
          {{
            vault_users_read | default({'teams': {}})
            | combine({
                'teams': {
                  (item.item.0.team): {
                    'users': (
                      (vault_users_read.teams[item.item.0.team] | default({'users': []})).users
                      + [item.secret.username]
                    )
                  }
                }
              }, recursive=true)
          }}
      loop: "{{ vault_result.results }}"
      loop_control:
        label: "{{ item.item.0.team }}/{{ item.item.1 }}"
      no_log: true

    - name: Show users read from Vault
      ansible.builtin.debug:
        msg: |-
          {% for team in vault_users_read.teams | dict2items %}
          team: {{ team.key }}
            users:
          {% for user in team.value.users %}
              - {{ user }}
          {% endfor %}

          {% endfor %}
